<div class="container py-4">

  <div class="card shadow-sm">

    <div class="card-header">
      <h3 class="mb-0">
        {{ theoremId ? 'Edycja twierdzenia' : 'Nowe twierdzenie' }}
      </h3>
    </div>

    <div class="card-body">

      <form [formGroup]="form" (ngSubmit)="save()">

        <div class="mb-3">
          <label class="form-label">
            Typ
          </label>

          <select
            class="form-select"
            formControlName="type">

            @for (type of theoremTypes; track type) {
              <option [value]="type">
                {{ type }}
              </option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="name">
            Nazwa
          </label>

          <input
            id="name"
            type="text"
            class="form-control"
            formControlName="name">
        </div>

        <div class="mb-3">
          <label class="form-label" for="statement">
            Treść
          </label>

          <textarea
            id="statement"
            rows="8"
            class="form-control font-monospace"
            formControlName="statement">
          </textarea>

          <div class="form-text">
            Możesz używać składni MathJax, np.
            <code>\(a+b=c\)</code>.
          </div>
        </div>

        <div class="mb-4">

          <label class="form-label d-block">
            Kategorie
          </label>

          <div class="row" formArrayName="categories">

            @for (category of categories(); track category.id; let i = $index) {
              
              <div class="col-md-4 mb-2">

                <div class="form-check">

                  <input
                    id="category{{category.id}}"
                    class="form-check-input"
                    type="checkbox"
                    [formControlName]="i">

                  <label class="form-check-label" for="category{{category.id}}">
                    {{ category.name }}
                  </label>

                </div>

              </div>

            }

          </div>

        </div>

        <button
          type="submit"
          class="btn btn-primary">

          Zapisz
        </button>

      </form>

    </div>

  </div>

</div>
